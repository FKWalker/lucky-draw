<app-component-card title="Edit News">
    <div class="space-y-6">
        @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="News created successfully"
                    [showLink]="false"
                />
            </div>
        }
        @if(error) {
            <div>
                <app-alert
                    variant="error"
                    title="Error"
                    message="Failed to create news"
                    [showLink]="false"
                />
            </div>
        }
        <div>
            <app-label for="input">Headline</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                     <app-label for="input">English</app-label>
                     <app-input-field type="text" id="input" placeholder="Enter a headline" [value]="newsForm.headline.en" (valueChange)="newsForm.headline.en = $event" [error]="errors.headline.en" [hint]="errors.headline.en ? 'This is an invalid headline.' : ''"/>
                </div>
                <div class="mt-3">
                     <app-label for="input">Japanese</app-label>
                     <app-input-field type="text" id="input" placeholder="Enter a headline" [value]="newsForm.headline.ja" (valueChange)="newsForm.headline.ja = $event"/>
                </div>
                <div class="mt-3">
                     <app-label for="input">Chinese</app-label>
                     <app-input-field type="text" id="input" placeholder="Enter a headline" [value]="newsForm.headline.zh" (valueChange)="newsForm.headline.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-label for="input">Filter</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="newsForm.filter.en" (valueChange)="newsForm.filter.en = $event" [error]="errors.filter.en" [hint]="errors.filter.en ? 'This is an invalid filter.' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="newsForm.filter.ja" (valueChange)="newsForm.filter.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Chinese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="newsForm.filter.zh" (valueChange)="newsForm.filter.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-label for="input">Title</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a title" [value]="newsForm.title.en" (valueChange)="newsForm.title.en = $event" [error]="errors.title.en" [hint]="errors.title.en ? 'This is an invalid title' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a title" [value]="newsForm.title.ja" (valueChange)="newsForm.title.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Chinese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a title" [value]="newsForm.title.zh" (valueChange)="newsForm.title.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-label for="input">Description</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="newsForm.description.en" (valueChange)="newsForm.description.en = $event" [error]="errors.description.en" [hint]="errors.description.en ? 'This is an invalid description' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="newsForm.description.ja" (valueChange)="newsForm.description.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Chinese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="newsForm.description.zh" (valueChange)="newsForm.description.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-date-picker
                id="date-picker"
                label="Published At"
                placeholder="Select a date"
                [enableTime]="true"
                [time24hr]="false"
                [enableSeconds]="true"
                [defaultDate]="currentDate"
                (dateChange)="handleDateChange($event)"
            />
        </div>
        <div>
            <app-label>Status</app-label>
            <app-select
                [options]="activeOptions"
                placeholder="Select Option"
                [value]="this.newsForm.active.toString()"
                (valueChange)="handleActiveSelectChange($event)"
                className="dark:bg-dark-900"
                [error]="errors.active"
                [hint]="errors.active ? 'Please select an active.' : ''"
            ></app-select>
        </div>
        <div>
            <app-label>News Image</app-label>
            <app-image-upload
                #fileUpload
                [imageUrl]="newsForm.news_image" 
                (change)="handleFileChange($event)"
            ></app-image-upload>
        </div>
        <div>
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Update</app-button>
        </div>
    </div>
</app-component-card>
