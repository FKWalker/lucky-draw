<app-component-card title="Edit Event">
    <div class="space-y-6">
        @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="Event edited successfully"
                    [showLink]="false"
                />
            </div>
        }
        @if(error) {
            <div>
                <app-alert
                    variant="error"
                    title="Error"
                    message="Failed to edit event"
                    [showLink]="false"
                />
            </div>
        }
        <div>
            <app-label for="input">Event Name</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a name" [value]="eventForm.event_name" (valueChange)="eventForm.event_name = $event" [error]="errors.event_name" [hint]="errors.event_name ? 'This is an invalid event name.' : ''" [disabled]="disabled"/>
        </div>
        <div>
            <app-label for="input">Event Code</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a release year" [value]="eventForm.event_code" (valueChange)="eventForm.event_code = $event" [error]="errors.event_code" [hint]="errors.event_code ? 'This is an invalid event code.' : ''" [disabled]="disabled"/>
        </div>
        <div>
            <app-label for="input">Password</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="eventForm.password" (valueChange)="eventForm.password = $event" [error]="errors.password" [hint]="errors.password ? 'This is an invalid password.' : ''" [disabled]="disabled"/>
        </div>
        <div>
            <div class="mb-4 text-left">
                <div class="flex items-baseline gap-2">
                    <app-label for="input">Draw Step</app-label>
                    <p class="text-xs text-gray-400 italic">
                        # For contest draw, please fill in this field.
                    </p>
                </div>
            </div>
            <!-- Add Button -->
            <app-button type="button" size="sm" variant="primary" (btnClick)="addDraw()" [disabled]="disabled">+ Add More</app-button>
            <div class="mt-3">
            @for (d of draws; track $index) {
                <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                    <div class="space-y-2">
                        <!-- Platform Input -->
                        <div>
                            <app-label>Draw Name</app-label>
                            <app-input-field
                            type="text"
                            placeholder="Enter draw name"
                            [value]="d.drawName" [disabled]="disabled"
                            (valueChange)="d.drawName = $event"
                            [error]="!!drawsErrors[$index]?.drawName"
                            [hint]="drawsErrors[$index]?.drawName || ''">
                            </app-input-field>
                        </div>

                        <!-- URL + Remove Button -->
                        <div>
                            <app-label>Number of Winner</app-label>
                            <app-input-field
                            type="number"
                            placeholder="Enter number of winner"
                            min="1"
                            [value]="d.number"
                            (valueChange)="d.number = $event"
                            [error]="!!drawsErrors[$index]?.number"
                            [hint]="drawsErrors[$index]?.number || ''">
                            </app-input-field>
                            <button
                                type="button" [disabled]="disabled"
                                class="px-2 py-1 text-white bg-red-500 rounded mt-2"
                                (click)="removeDraw($index)">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
                
            }
            </div>
        </div>
        <div>
            <app-label>Participants File</app-label>
            <app-file-input #fileUpload (fileSelected)="handleFileChange($event)" className="custom-class" [error]="errors.file" [hint]="errors.file ? 'This is an invalid file.' : ''"></app-file-input>
            <p class="text-sm font-medium text-blue-600 dark:text-blue-400">{{eventForm.file_name}}</p>
        </div>
        <div class="flex gap-3">
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Edit</app-button>
            <app-button type="submit" size="sm" variant="outline" (btnClick)="onCancel()" [disabled]="disabled">Back</app-button>
        </div>
    </div>
</app-component-card>
