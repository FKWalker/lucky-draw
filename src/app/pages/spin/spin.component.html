<div class="relative flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 via-gray-950 to-indigo-950 text-white overflow-hidden p-6">
  <button 
    (click)="openSettings()"
    class="absolute top-6 right-6 z-30 flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-gray-900/80 hover:bg-gray-800 border border-indigo-500/30 text-gray-300 hover:text-white backdrop-blur-md shadow-lg shadow-purple-500/10 transition-all duration-200 cursor-pointer group">
    <svg class="w-5 h-5 text-indigo-400 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
    <span class="text-xs font-semibold tracking-wider uppercase">Settings</span>
  </button>
  <!-- Optional decorative background glowing effect -->
  <div class="absolute w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none -top-20 -left-20 animate-pulse"></div>
  <div class="absolute w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none -bottom-20 -right-20 animate-pulse"></div>

  <!-- Header Info -->
  <div class="z-10 text-center mb-12">
    <span class="px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-blue-500/10 text-blue-400 border border-blue-500/20">
      Live Lucky Draw
    </span>
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mt-4 text-white">
      Ready for the Draw?
    </h1>
    <p class="text-gray-400 text-sm md:text-base mt-2">
      Click the button below to pick this round's winner!
    </p>
  </div>

  <!-- Big Interactive Lucky Draw Button -->
  <div class="z-10 flex flex-col items-center">
    <button 
      (click)="triggerDraw()" 
      [disabled]="isDrawing || isDone"
      class="group relative inline-flex items-center justify-center px-12 py-8 md:px-20 md:py-12 text-2xl md:text-4xl font-black text-white uppercase tracking-wider bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-3xl shadow-2xl shadow-indigo-500/40 hover:shadow-indigo-500/60 hover:scale-105 active:scale-95 transition-all duration-300 disabled:opacity-50 disabled:pointer-events-none cursor-pointer border border-white/20">
      
      <!-- Button Glow Animation Ring -->
      <span class="absolute -inset-1 rounded-3xl bg-gradient-to-r from-blue-600 to-purple-600 opacity-30 blur-lg group-hover:opacity-75 transition duration-500"></span>
      
      <!-- Button Text / Icon State -->
      <span class="relative flex items-center gap-4">
        @if (isDrawing) {
          <svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Spining...
        } @else if(isDone){
          🎁 All draw rounds have been completed!
        }@else {
          🎁 Start Spin!
        }
      </span>
    </button>
  </div>

  <!-- Footer / Status Note -->
  <div class="z-10 mt-12 text-xs text-gray-500">
    Event Code: <span class="text-gray-400 font-mono">{{ eventCode || 'N/A' }}</span>
  </div>

  <!-- Hidden Popup Modal -->
  @if (showHiddenModal) {
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in">
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center relative overflow-hidden">
  
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-blue-600/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="mx-auto w-16 h-16 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-indigo-500/30 mb-4">
          🎉
        </div>
        <h3 class="text-2xl font-bold text-white tracking-tight">Pick Winner!</h3>
        <p class="text-gray-400 text-sm mt-1">Select the lucky participants of this round.</p>
        <!-- Member Code Input Field -->
        <div class="text-left p-5">
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Member Code</label>
          <input 
            type="text" 
            [(ngModel)]="memberCode"
            placeholder="Enter member Code"
            class="w-full px-4 py-3 rounded-xl bg-gray-800/80 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all font-mono"
          />
          <div>
            @if(invalidMemberCode){
              <p class="text-xs text-red-400">Invalid member code</p>
            }
          </div>
        </div>
        <div class="flex gap-3 p-3 justify-center">
          <app-button type="submit" size="sm" variant="primary" (btnClick)="submitHiddenModal()" [disabled]="disabled" size="md">Submit</app-button>
          <app-button type="submit" size="sm" variant="outline" (btnClick)="closeHiddenModal()" [disabled]="disabled" size="md">Close</app-button>
        </div>
      </div>
    </div>
  }

</div>
