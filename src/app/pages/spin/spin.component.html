<div class="relative flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-gray-900 via-gray-950 to-indigo-950 text-white overflow-hidden p-6">
  
  <!-- Optional decorative background glowing effect -->
  <div class="absolute w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none -top-20 -left-20 animate-pulse"></div>
  <div class="absolute w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none -bottom-20 -right-20 animate-pulse"></div>

  <!-- Header Info -->
  <div class="z-10 text-center mb-12">
    <span class="px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider uppercase bg-blue-500/10 text-blue-400 border border-blue-500/20">
      Live Lucky Draw
    </span>
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mt-4 text-white">
      Ready for the Draw?
    </h1>
    <p class="text-gray-400 text-sm md:text-base mt-2">
      Click the button below to pick this round's winner!
    </p>
  </div>

  <!-- Big Interactive Lucky Draw Button -->
  <div class="z-10 flex flex-col items-center">
    <button 
      (click)="triggerDraw()" 
      [disabled]="isDrawing"
      class="group relative inline-flex items-center justify-center px-12 py-8 md:px-20 md:py-12 text-2xl md:text-4xl font-black text-white uppercase tracking-wider bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-3xl shadow-2xl shadow-indigo-500/40 hover:shadow-indigo-500/60 hover:scale-105 active:scale-95 transition-all duration-300 disabled:opacity-50 disabled:pointer-events-none cursor-pointer border border-white/20">
      
      <!-- Button Glow Animation Ring -->
      <span class="absolute -inset-1 rounded-3xl bg-gradient-to-r from-blue-600 to-purple-600 opacity-30 blur-lg group-hover:opacity-75 transition duration-500"></span>
      
      <!-- Button Text / Icon State -->
      <span class="relative flex items-center gap-4">
        @if (isDrawing) {
          <svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Drawing...
        } @else {
          🎁 Start Draw!
        }
      </span>
    </button>
  </div>

  <!-- Footer / Status Note -->
  <div class="z-10 mt-12 text-xs text-gray-500">
    Event Code: <span class="text-gray-400 font-mono">{{ eventCode || 'N/A' }}</span>
  </div>

</div>
