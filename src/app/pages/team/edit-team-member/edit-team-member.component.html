<app-component-card title="Edit Team Member">
    <div class="space-y-6">
        @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="Team member updated successfully"
                    [showLink]="false"
                />
            </div>
        }
        @if(error) {
            <div>
                <app-alert
                    variant="error"
                    title="Error"
                    message="Failed to update team member"
                    [showLink]="false"
                />
            </div>
        }
        <div>
            <app-label for="input">Name</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a name" [value]="teamMemberForm.name" (valueChange)="teamMemberForm.name = $event" [error]="errors.name" [hint]="errors.name ? 'This is an invalid name.' : ''"/>
        </div>
        <div>
            <app-label>Profile Image</app-label>
            <app-image-upload
                #fileUpload
                [imageUrl]="teamMemberForm.profile_image"   
                (change)="handleFileChange($event)"
                [error]="errors.profile_image"
                [hint]="errors.profile_image ? 'This is an invalid file.' : ''"
            ></app-image-upload>
        </div>
        <div>
            <app-label for="input">Position</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a position" [value]="teamMemberForm.position" (valueChange)="teamMemberForm.position = $event" [error]="errors.position" [hint]="errors.position ? 'This is an invalid position' : ''"/>
        </div>
        <div>
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Create</app-button>
        </div>
    </div>
</app-component-card>
