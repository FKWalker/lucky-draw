<div class="relative flex flex-col items-center justify-center min-h-screen text-white overflow-hidden p-6 select-none"
  style="background-image: url('images/draw/lucky-draw-bg.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">

<div class="picker-section">

  <!-- 3D Carousel Scene -->
  <div class="scene">

    <div class="center-light"></div>

    <!-- Rotating carousel -->
    <div class="carousel" [style.transform]="carouselRotation">

      <div class="participant-card" *ngFor="let participant of visibleParticipants; let i = index" [class.selected]="selectedIndex === i"
        [style.transform]="getCardTransform(i)">
        <div class="card-inner">
          <div class="card-name">
            {{ participant.name }}
          </div>
        </div>
      </div> 
    </div>

    <!-- Fixed selection frame -->
    <div class="selector">
      <span class="selector-arrow top-arrow">▶</span>
      <span class="selector-arrow bottom-arrow">▶</span>
    </div>
  </div>

  <div>
    {{ winner }}
  </div>

  <!-- Draw button -->
  <div class="controls">
    <button class="draw-button" [disabled]="isDrawing" (click)="spin()">
      {{ isDrawing ? 'DRAWING...' : 'SPIN' }}
    </button>
  </div>

  <!-- Spotlight overlay -->
  <div class="spotlight-overlay" [class.active]="showSpotlight">
  </div>
  
  <!-- Particles -->
  <div class="particles">
    <span class="particle" *ngFor="let particle of particles" [style.left.px]="particle.x" [style.top.px]="particle.y"
      [style.--tx]="particle.tx + 'px'" [style.--ty]="particle.ty + 'px'">
    </span>
  </div> 

</div>


</div>
