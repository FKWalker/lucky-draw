<div class="space-y-6">
    @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="Discography deleted successfully"
                    [showLink]="false"
                />
            </div>
        }
    @if(error) {
        <div>
            <app-alert
                variant="error"
                title="Error"
                message="Failed to delete discography"
                [showLink]="false"
            />
        </div>
    }
    <div>
        <app-component-card title="Advance Search">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <app-label>Artist</app-label>
                    <app-select
                        [options]="artistOptions"
                        placeholder="Select Option"
                        (valueChange)="handleArtistSelectChange($event)"
                        className="dark:bg-dark-900"
                    ></app-select>
                </div>
                <div>
                    <app-label>Active</app-label>
                    <app-select
                        [options]="activeOptions"
                        placeholder="Select Option"
                        (valueChange)="handleActiveSelectChange($event)"
                        className="dark:bg-dark-900"
                    ></app-select>
                </div>
                <div>
                    <app-label for="input">Release Year</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a release year" [value]="discographyForm.release_year" (valueChange)="discographyForm.release_year = $event"/>
                </div>
                <div>
                    <app-label for="input">Filter</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="discographyForm.filter" (valueChange)="discographyForm.filter = $event"/>
                </div>
                <div>
                    <app-label for="input">Search</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a word" [value]="discographyForm.search" (valueChange)="discographyForm.search = $event"/>
                </div>
            </div>
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Search</app-button>
        </app-component-card>
    </div>
    
    @if (isLoading) {
        <div class="flex justify-center items-center py-12">
            <app-loading-spinner 
                size="lg" 
                [showText]="true" 
                text="Loading discographies..."
                containerClass="flex-col"
            ></app-loading-spinner>
        </div>
    } @else {
        <app-custom-table
        title="Listing Discography"
        [columns]="columns"
        [data]="discographies"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [itemsPerPage]="itemsPerPage"
        [enableSearch]="false"
        (pageChange)="loadPage($event)"
        (searchChange)="onSearch($event)"
        (action)="action($event)"
        ></app-custom-table>
    }
</div>
