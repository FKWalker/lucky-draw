<app-component-card title="Add Discography">
    <div class="space-y-6">
        @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="Discography created successfully"
                    [showLink]="false"
                />
            </div>
        }
        @if(error) {
            <div>
                <app-alert
                    variant="error"
                    title="Error"
                    message="Failed to create discography"
                    [showLink]="false"
                />
            </div>
        }
        <div>
            <app-label for="input">Name</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a name" [value]="discographyForm.name.en" (valueChange)="discographyForm.name.en = $event" [error]="errors.name.en" [hint]="errors.name.en ? 'This is an invalid name.' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a name" [value]="discographyForm.name.ja" (valueChange)="discographyForm.name.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Chinese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a name" [value]="discographyForm.name.zh" (valueChange)="discographyForm.name.za = $event"/>
                </div>
            </div>
        </div>
        
        <div>
            <app-label for="input">Release Year</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a release year" [value]="discographyForm.release_year" (valueChange)="discographyForm.release_year = $event" [error]="errors.release_year" [hint]="errors.release_year ? 'This is an invalid release year.' : ''"/>
        </div>
        <div>
            <app-label for="input">Filter</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a filter" [value]="discographyForm.filter" (valueChange)="discographyForm.filter = $event" [error]="errors.filter" [hint]="errors.filter ? 'This is an invalid filter.' : ''"/>
        </div>
        <div>
            <app-label for="input">Description</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="discographyForm.description.en" (valueChange)="discographyForm.description.en = $event" [error]="errors.description.en" [hint]="errors.description.en ? 'This is an invalid description.' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="discographyForm.description.ja" (valueChange)="discographyForm.description.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Chinese</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a description" [value]="discographyForm.description.zh" (valueChange)="discographyForm.description.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-label for="input">Social Media</app-label>
            <!-- Add Button -->
            <app-button type="button" size="sm" variant="primary" (btnClick)="addSocialMedia()" [disabled]="disabled">+ Add More</app-button>
            <div class="mt-3">
            @for (sm of socialMedias; track $index) {
                <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                    <div class="space-y-2">
                        <!-- Platform Input -->
                        <div>
                            <app-label>Platform</app-label>
                            <app-input-field
                            type="text"
                            placeholder="Enter platform (e.g. TikTok)"
                            [value]="sm.platform"
                            (valueChange)="sm.platform = $event"
                            [error]="!!socialMediasErrors[$index]?.platform"
                            [hint]="socialMediasErrors[$index]?.platform || ''">
                            </app-input-field>
                        </div>

                        <!-- URL + Remove Button -->
                        <div>
                            <app-label>Social Media URL</app-label>
                            <app-input-field
                            type="text"
                            placeholder="Enter URL"
                            [value]="sm.url"
                            (valueChange)="sm.url = $event"
                            [error]="!!socialMediasErrors[$index]?.url"
                            [hint]="socialMediasErrors[$index]?.url || ''">
                            </app-input-field>
                            <button
                                type="button"
                                class="px-2 py-1 text-white bg-red-500 rounded mt-2"
                                (click)="removeSocialMedia($index)">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
                
            }
            </div>
        </div>
        <div>
            <app-label>Artist</app-label>
            <app-select
                [options]="artistOptions"
                placeholder="Select Option"
                [value]="this.discographyForm.artist_id.toString()"
                (valueChange)="handleArtistSelectChange($event)"
                className="dark:bg-dark-900"
                [error]="errors.artist_id"
                [hint]="errors.artist_id ? 'Please select an artist.' : ''"
            ></app-select>
        </div>
        <div>
            <app-label>Status</app-label>
                <app-select
                    [options]="activeOptions"
                    placeholder="Select Option"
                    [value]="this.discographyForm.active.toString()"
                    (valueChange)="handleActiveSelectChange($event)"
                    className="dark:bg-dark-900"
                    [error]="errors.active"
                    [hint]="errors.active ? 'Please select an active.' : ''"
                ></app-select>
            </div>
        <div>
            <app-label>Profile Image</app-label>
            <app-image-upload
                #fileUpload
                (change)="handleFileChange($event)"
                [error]="errors.profile_image"
                [hint]="errors.profile_image ? 'This is an invalid file.' : ''"
            ></app-image-upload>
        </div>
        <div>
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Create</app-button>
        </div>
    </div>
</app-component-card>
