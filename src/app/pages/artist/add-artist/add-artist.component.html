<app-component-card title="Add Artist">
    <div class="space-y-6">
        @if (success) {
            <div>
                <app-alert
                    variant="success"
                    title="Success"
                    message="Artist created successfully"
                    [showLink]="false"
                />
            </div>
        }
        @if(error) {
            <div>
                <app-alert
                    variant="error"
                    title="Error"
                    message="Failed to create artist"
                    [showLink]="false"
                />
            </div>
        }
        <div>
            <app-label for="input">First Name</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a first name" [value]="artistForm.first_name" (valueChange)="artistForm.first_name = $event" [error]="errors.first_name" [hint]="errors.first_name ? 'This is an invalid first name.' : ''"/>
        </div>
        <div>
            <app-label for="input">Last Name</app-label>
            <app-input-field type="text" id="input" placeholder="Enter a last name" [value]="artistForm.last_name" (valueChange)="artistForm.last_name = $event" [error]="errors.last_name" [hint]="errors.last_name ? 'This is an invalid last name.' : ''"/>
        </div>
        <div>
            <app-label>Profile Image</app-label>
            <app-image-upload
                #fileUpload
                (change)="handleFileChange($event)"
                [error]="errors.profile_image"
                [hint]="errors.profile_image ? 'This is an invalid file.' : ''"
            ></app-image-upload>
        </div>
        <div>
            <app-label for="input">Biography</app-label>
            <div class="border border-gray-200 rounded-xl p-4 mb-3 bg-gray-50 dark:border-gray-700 dark:bg-gray-900">
                <div>
                    <app-label for="input">English Biography</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a position" [value]="artistForm.biography.en" (valueChange)="artistForm.biography.en = $event" [error]="errors.biography.en" [hint]="errors.biography.en ? 'This is an invalid biography' : ''"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Japanese Biography</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a position" [value]="artistForm.biography.ja" (valueChange)="artistForm.biography.ja = $event"/>
                </div>
                <div class="mt-3">
                    <app-label for="input">Traditional Chinese Biography</app-label>
                    <app-input-field type="text" id="input" placeholder="Enter a position" [value]="artistForm.biography.zh" (valueChange)="artistForm.biography.zh = $event"/>
                </div>
            </div>
        </div>
        <div>
            <app-button type="submit" size="sm" variant="primary" (btnClick)="onSubmit()" [disabled]="disabled">Create</app-button>
        </div>
    </div>
</app-component-card>
