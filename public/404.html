<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lucky Draw</title>

  <script>
    sessionStorage.redirect = location.href;

    const l = window.location;
    const repo = '/' + l.pathname.split('/')[1];

    l.replace(
      l.protocol + '//' + l.hostname +
      (l.port ? ':' + l.port : '') +
      repo
    );
  </script>
</head>
<body>
</body>
</html>
